# This project was generated with 0.4.2 using template: https://github.com/beeware/briefcase-template @ v0.4.2
[tool.briefcase]
project_name = "Bastion Pass"
bundle = "com.coryellcottage.bastionpass"
version = "1.0.0"
url = "https://coryellcottage.github.com/bastionpass"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
author = "Spyridon Coryell"
author_email = "SpyridonCoryell@protonmail.com"

icon = "icons/BastionPass"
splash_background_color = '#02ADFF'

[tool.briefcase.app.bastionpass]
formal_name = "Bastion Pass"
description = "A cross-platform password manager written in python"
long_description = """Bastion Pass is a open source, cross platform password manager.

**Supported Platforms**
Bastion Pass is current supported on the following platforms:

	Linux (Debian, Arch and RHEL)
	Windows
	Mac
	Android

**Donations**
To donate to Bastion Pass use these links:
	Buy Me A Coffee: buymeacoffee.com/bastionpass

**Source Code**
The source code for Bastion Pass can be found here:
	https://github.com/coryellcottage/bastion-pass

You can contribute to Bastion Pass there, report issues with Bastion Pass, request features, or just give feedback
"""
sources = [
    "src/bastionpass",
]
test_sources = [
    "tests",
]

requires = ["json_repair", "uvicorn", "fastapi", "httpx", "psutil", "keyring", "cryptography",
]
test_requires = [
    "pytest",
    "pillow",
    "keyring",
    "requests",
    "toga-dummy",
    "netifaces-plus"
]

[tool.briefcase.app.bastionpass.macOS]
universal_build = true
requires = [
    "toga-cocoa~=0.5.0",
    "std-nslog~=1.0.3",
    "pyperclip" # Needed for clipbaord functionality
]

[tool.briefcase.app.bastionpass.linux]
requires = [
    "toga-gtk~=0.5.0",
    # PyGObject 3.52.1 enforces a requirement on libgirepository-2.0-dev. This library
    # isn't available on Debian 12/Ubuntu 22.04. If you don't need to support those (or
    # older) releases, you can remove this version pin. See beeware/toga#3143.
#    "pygobject < 3.52.1",
    "pyperclip", # Needed for clipbaord functionality
]

[tool.briefcase.app.bastionpass.linux.system.debian]
system_requires = [
    # Needed to compile pycairo wheel
    "libcairo2-dev",
    # One of the following two packages are needed to compile PyGObject wheel. If you
    # remove the pygobject pin in the requires list, you should also change to the
    # version 2.0 of the girepository library. See beeware/toga#3143.
    # "libgirepository1.0-dev",
    "libgirepository-2.0-dev",
    "python3-dbus", # Needed for keyring functinality
    "dbus-x11" # Needed for keyring functionality
]

system_runtime_requires = [
    # Needed to provide GTK and its GI bindings
    "gir1.2-gtk-3.0",
    # One of the following two packages are needed to use PyGObject at runtime. If you
    # remove the pygobject pin in the requires list, you should also change to the
    # version 2.0 of the girepository library. See beeware/toga#3143.
    "libgirepository-1.0-1",
    # "libgirepository-2.0-0",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3-module",
    # Needed to provide WebKit2 at runtime
    # Note: Debian 11 requires gir1.2-webkit2-4.0 instead
    # "gir1.2-webkit2-4.1",
    "xclip", # Needed for pyperclip
    "gnome-keyring" # Needed for keyring functionality
]

[tool.briefcase.app.bastionpass.linux.system.rhel]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo-gobject-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
]

system_runtime_requires = [
    # Needed to support Python bindings to GTK
    "gobject-introspection",
    # Needed to provide GTK
    "gtk3",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3",
    # Needed to provide WebKit2 at runtime
    # "webkit2gtk3",
    "xclip" # Needed for pyperclip
]

[tool.briefcase.app.bastionpass.linux.system.suse]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
]

system_runtime_requires = [
    # Needed to provide GTK
    "gtk3",
    # Needed to support Python bindings to GTK
    "gobject-introspection", "typelib(Gtk) = 3.0",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3-module",
    # Needed to provide WebKit2 at runtime
    # "libwebkit2gtk3", "typelib(WebKit2)",
    "xclip" # Needed for pyperclip
]

[tool.briefcase.app.bastionpass.linux.system.arch]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo",
    # Needed to compile PyGObject wheel
    "gobject-introspection",
    # Runtime dependencies that need to exist so that the
    # Arch package passes final validation.
    # Needed to provide GTK
    "gtk3",
    # Dependencies that GTK looks for at runtime
    "libcanberra",
    # Needed to provide WebKit2
    # "webkit2gtk",
]

system_runtime_requires = [
    # Needed to provide GTK
    "gtk3",
    # Needed to provide PyGObject bindings
    "gobject-introspection-runtime",
    # Dependencies that GTK looks for at runtime
    "libcanberra",
    # Needed to provide WebKit2 at runtime
    # "webkit2gtk",
]

[tool.briefcase.app.bastionpass.linux.appimage]
manylinux = "manylinux_2_28"

system_requires = [
    # Needed to compile pycairo wheel
    "cairo-gobject-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
    # Needed to provide GTK
    "gtk3-devel",
    # Dependencies that GTK looks for at runtime, that need to be
    # in the build environment to be picked up by linuxdeploy
    "libcanberra-gtk3",
    "PackageKit-gtk3-module",
    "gvfs-client",
]

linuxdeploy_plugins = [
    "DEPLOY_GTK_VERSION=3 gtk",
]

[tool.briefcase.app.bastionpass.linux.flatpak]
flatpak_runtime = "org.gnome.Platform"
flatpak_runtime_version = "48"
flatpak_sdk = "org.gnome.Sdk"

[tool.briefcase.app.bastionpass.windows]
requires = [
    "toga-winforms~=0.5.0",
    "git+https://bitbucket.org/TomArn/tatogalib.git@version_2025-02-26"
]

# Mobile deployments
[tool.briefcase.app.bastionpass.iOS]
requires = [
    "toga-iOS~=0.5.0",
    "std-nslog~=1.0.3",
]

[tool.briefcase.app.bastionpass.android]
requires = [
    "pydantic<2",
    "toga-android~=0.5.0",
    "git+https://bitbucket.org/TomArn/tatogalib.git@version_2025-02-26",
]

requirement_installer_args = [
    "--extra-index",
    "https://smallcoder13.github.io/simple",
]

base_theme = "Theme.MaterialComponents.Light.DarkActionBar"

build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
    # Needed for DetailedList
    # "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
    # Needed for MapView
    # "org.osmdroid:osmdroid-android:6.1.20",
    # Needed for WebView
    # "androidx.webkit:webkit:1.15.0",
]

# Needed for WebView
# build_gradle_extra_content="""
# chaquopy.defaultConfig.staticProxy("toga_android.widgets.internal.webview")
# """

# Web deployments
[tool.briefcase.app.bastionpass.web]
requires = [
    "toga-web~=0.5.0",
]

